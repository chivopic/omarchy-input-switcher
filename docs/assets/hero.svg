<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Input Switch — Chinese and English, one click away.</title>
  <desc id="desc">A native Omarchy input switcher. A compact language badge, direct language selection and verified Fcitx5 and Rime state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17222b"/><stop offset="1" stop-color="#0c1219"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#375f50" stop-opacity=".32"/><stop offset="1" stop-color="#375f50" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#61746f" opacity=".2"/></pattern>
  </defs>
  <rect width="1600" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="28" fill="url(#dots)"/>
  <ellipse cx="1210" cy="340" rx="440" ry="370" fill="url(#glow)"/>
  <g font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif">
    <rect x="80" y="72" width="11" height="11" rx="3" fill="#abd8c1"/>
    <text x="106" y="84" fill="#abd8c1" font-size="18" letter-spacing="4">BUILT FOR OMARCHY</text>
    <text x="76" y="226" fill="#edf3f1" font-size="100" font-weight="700" letter-spacing="-5">Input Switch</text>
    <text x="82" y="317" fill="#b2ddc6" font-size="60" font-weight="500">中文</text>
    <text x="236" y="311" fill="#617d72" font-size="50">↔</text>
    <text x="318" y="317" fill="#edf3f1" font-size="60" font-weight="500">English</text>
    <text x="83" y="392" fill="#a6b5bf" font-size="27">One click. A clear state. Keep typing.</text>
    <text x="84" y="471" fill="#82959e" font-size="21">Native QML · Fcitx5 + Rime · Verified switching</text>
    <path d="M84 560H682" stroke="#34483f"/>
    <text x="84" y="605" fill="#a9bdb1" font-size="19" letter-spacing="1">SMALL IN THE BAR. PRECISE WHERE IT MATTERS.</text>
    <g transform="translate(890 120)">
      <rect width="620" height="74" rx="17" fill="#1b2630" stroke="#40524b"/>
      <text x="28" y="46" fill="#81949c" font-size="20">1 · 2 · 3</text>
      <text x="251" y="46" fill="#dce7e2" font-size="20">19:42</text>
      <rect x="463" y="15" width="64" height="44" rx="10" fill="#294437"/>
      <text x="495" y="46" text-anchor="middle" fill="#bfe8cf" font-size="25">中</text>
      <text x="555" y="46" text-anchor="middle" fill="#7d9196" font-size="20">EN</text>
      <g transform="translate(170 100)">
        <rect width="450" height="308" rx="19" fill="#18222c" stroke="#40524b"/>
        <text x="28" y="52" fill="#e2ece6" font-size="22">Input method</text>
        <text x="420" y="52" text-anchor="end" fill="#a1b5ae" font-size="20">Rime</text>
        <rect x="27" y="83" width="188" height="64" rx="11" fill="#294437"/>
        <text x="121" y="125" text-anchor="middle" fill="#bfe8cf" font-size="29">中文</text>
        <text x="321" y="125" text-anchor="middle" fill="#dce7e2" font-size="25">English</text>
        <text x="29" y="192" fill="#9cafab" font-family="monospace" font-size="19">rime_ice</text>
        <path d="M28 216H422" stroke="#34483f"/>
        <circle cx="35" cy="256" r="5" fill="#acd5bd"/>
        <text x="52" y="263" fill="#b6c9be" font-size="19">Actual mode. Confirmed.</text>
      </g>
      <rect x="69" y="440" width="404" height="83" rx="17" fill="#1b2c26" stroke="#486b56"/>
      <text x="107" y="493" fill="#bfe8cf" font-size="35">中</text>
      <text x="171" y="477" fill="#e0ece4" font-size="22">Chinese input</text>
      <text x="172" y="504" fill="#93afa0" font-size="17">A brief, focus-free confirmation</text>
    </g>
  </g>
</svg>
